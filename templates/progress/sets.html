<!-- templates/progress/sets.html -->
<div class="sets-detail">
    <!-- Lista de mediciones -->
    <div class="card">
        <h3 style="margin-top: 0; color: var(--charcoal); font-family: 'Playfair Display', serif; margin-bottom: 1.25rem; display: flex; align-items: center; justify-content: space-between;">
            <span>History</span>
        </h3>
        
        {% if sets and sets|length > 0 %}
            <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                {% for s in sets %}
                <div style="display: flex; align-items: center; justify-content: space-between; padding: 0.75rem 1rem; background: var(--cream); border-radius: var(--radius); border: 2px solid var(--border-light); transition: var(--transition);">
                    <div style="display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap;">
                        <div style="display: flex; align-items: baseline; gap: 0.25rem;">
                                <span style="font-size: 1.25rem; font-weight: 700; color: var(--charcoal);">{{ s.weight }}kg x {{ s.reps }} reps</span>
                        </div>
                        <span style="color: var(--text-secondary); font-size: 0.9rem; background: var(--beige); padding: 0.2rem 0.8rem; border-radius: 20px;">
                            {{ s.date }}
                        </span>
                    </div>
                </div>
                {% endfor %}
            </div>
        {% else %}
            <div style="padding: 2rem; text-align: center; background: var(--cream); border-radius: var(--radius);">
                <p style="color: var(--text-muted); margin-bottom: 0.5rem;">No sets yet</p>
            </div>
        {% endif %}
    </div>
</div>
