<!-- templates/train/workout.html -->
{% extends "base.html" %}

{% block content %}
<div class="workout-container" style="max-width: 800px; margin: 0 auto;">
    <h2 style="color: var(--terracotta); font-family: 'Playfair Display', serif; margin-bottom: 2rem;">Workout</h2>
    
    <form method="POST" action="{{ url_for('train.save_workout') }}" id="workout-form">
        {% for ex in exercises %}
            <div class="exercise-container card" data-exercise-id="{{ ex.idExercise }}" style="margin-bottom: 2rem; padding: 1.5rem;">
                <h3 style="color: var(--terracotta); margin-top: 0; margin-bottom: 1.25rem; font-family: 'Playfair Display', serif;">{{ ex.exercise_name }}</h3>
                <input type="hidden" name="exercise_ids" value="{{ ex.idExercise }}">
                
                <div class="sets-container" style="margin-bottom: 1.25rem;">
                    {% for i in range(ex.numSets) %}
                        <div class="set-row" style="margin-bottom: 1rem; padding: 0.75rem; background: var(--cream); border-radius: var(--radius); border: 2px solid var(--border-light);">
                            <label style="display: inline-block; min-width: 60px; font-weight: 600; color: var(--text-secondary);">Set {{ i + 1 }}:</label>
                            <input type="number" 
                                   name="reps_{{ ex.idExercise }}_{{ i }}" 
                                   placeholder="Reps" 
                                   step="1" 
                                   min="0"
                                   required
                                   style="width: 100px; padding: 0.5rem; margin-right: 0.5rem; border: 2px solid var(--border-color); border-radius: var(--radius);">
                            <input type="number" 
                                   name="weight_{{ ex.idExercise }}_{{ i }}" 
                                   placeholder="Weight (kg)" 
                                   min="0"
                                   required
                                   style="width: 120px; padding: 0.5rem; border: 2px solid var(--border-color); border-radius: var(--radius);">
                        </div>
                    {% endfor %}
                </div>
                
                <div style="display: flex; gap: 0.75rem; margin-top: 0.5rem;">
                    <button type="button" class="add-set-btn btn btn-secondary" onclick="addSet(this)" style="padding: 0.5rem 1rem;">
                        + Add Set
                    </button>
                    <button type="button" class="delete-set-btn btn btn-secondary" onclick="deleteLastSet(this)" style="padding: 0.5rem 1rem; background: var(--brick); color: white; border: none;">
                        - Delete Last Set
                    </button>
                </div>
            </div>
        {% endfor %}
        
        <div style="display: flex; gap: 1rem; margin-top: 1rem; justify-content: flex-end;">
            <button type="button" onclick="cancelWorkout()" class="btn btn-secondary" style="padding: 0.85rem 2rem;">
                Cancel
            </button>
            <button type="submit" class="btn btn-primary" style="padding: 0.85rem 2rem;">
                Finish Workout
            </button>
        </div>
    </form>
</div>

<script>
function addSet(button) {
    // Encontrar el contenedor del ejercicio
    const exerciseContainer = button.closest('.exercise-container');
    const exerciseId = exerciseContainer.dataset.exerciseId;
    const setsContainer = exerciseContainer.querySelector('.sets-container');
    
    // El nuevo índice es igual al número actual de series
    const newSetIndex = setsContainer.children.length;
    
    // Crear nueva serie
    const newSetRow = document.createElement('div');
    newSetRow.className = 'set-row';
    newSetRow.style.marginBottom = '1rem';
    newSetRow.style.padding = '0.75rem';
    newSetRow.style.background = 'var(--cream)';
    newSetRow.style.borderRadius = 'var(--radius)';
    newSetRow.style.border = '2px solid var(--border-light)';
    newSetRow.innerHTML = `
        <label style="display: inline-block; min-width: 60px; font-weight: 600; color: var(--text-secondary);">Set ${newSetIndex + 1}:</label>
        <input type="number" 
               name="reps_${exerciseId}_${newSetIndex}" 
               placeholder="Reps" 
               step="1" 
               min="0"
               required
               style="width: 100px; padding: 0.5rem; margin-right: 0.5rem; border: 2px solid var(--border-color); border-radius: var(--radius);">
        <input type="number" 
               name="weight_${exerciseId}_${newSetIndex}" 
               placeholder="Weight (kg)" 
               min="0"
               required
               style="width: 120px; padding: 0.5rem; border: 2px solid var(--border-color); border-radius: var(--radius);">
    `;
    
    setsContainer.appendChild(newSetRow);
}

function deleteLastSet(button) {
    // Encontrar el contenedor del ejercicio
    const exerciseContainer = button.closest('.exercise-container');
    const setsContainer = exerciseContainer.querySelector('.sets-container');
    
    // Obtener todas las series
    const setRows = setsContainer.querySelectorAll('.set-row');
    
    // Si hay al menos una serie, eliminar la última
    if (setRows.length > 0) {
        const lastSet = setRows[setRows.length - 1];
        lastSet.remove();
    }
}

function cancelWorkout() {
    if (confirm('¿Estás seguro de que quieres cancelar el workout? Los datos no guardados se perderán.')) {
        window.location.href = "{{ url_for('train.index') }}";
    }
}
</script>

<style>
    .workout-container {
        animation: fadeIn 0.3s ease;
    }
    
    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    .exercise-container {
        transition: var(--transition);
    }
    
    .exercise-container:hover {
        box-shadow: var(--shadow);
    }
    
    .set-row input:focus {
        outline: none;
        border-color: var(--terracotta) !important;
        box-shadow: 0 0 0 3px rgba(198, 123, 92, 0.1);
    }
    
    .add-set-btn:hover {
        background: var(--sage) !important;
        color: white !important;
    }
    
    .delete-set-btn:hover {
        background: var(--terracotta-dark) !important;
    }
</style>
{% endblock %}
