{% extends "base.html" %}

{% block title %}Login - GymGraph{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1>Welcome back</h1>
            <p class="auth-subtitle">DEMO USERNAME:"user1" PASSWORD:"123"</p>
        </div>
        
        <form method="POST" class="auth-form">
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-icon-wrapper">
                    <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    <input type="text" name="username" id="username" placeholder="Enter your username" required autocomplete="username">
                </div>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-icon-wrapper">
                    <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    <input type="password" name="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary auth-submit">
                Log in
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
            </button>
        </form>
        
        <div class="auth-footer">
            <p>Don't have an account? <a href="{{ url_for('auth.signup') }}">Sign up here</a></p>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_css %}
<style>
    .auth-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: calc(100vh - 200px);
        padding: 2rem 1rem;
    }
    
    .auth-card {
        background: white;
        border: 2px solid var(--border-light);
        border-radius: var(--radius-xl);
        padding: 3rem 2.5rem;
        width: 100%;
        max-width: 440px;
        box-shadow: var(--shadow-lg);
        animation: slideUp 0.5s ease;
    }
    
    @keyframes slideUp {
        from {
            opacity: 0;
            transform: translateY(24px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    .auth-header {
        text-align: center;
        margin-bottom: 2.5rem;
    }
    
    .auth-header h1 {
        font-size: 2rem;
        color: var(--text-primary);
        margin-bottom: 0.5rem;
    }
    
    .auth-subtitle {
        color: var(--text-muted);
        font-size: 0.95rem;
    }
    
    .auth-form {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
    }
    
    .input-icon-wrapper {
        position: relative;
        display: flex;
        align-items: center;
    }
    
    .input-icon {
        position: absolute;
        left: 1rem;
        color: var(--text-muted);
        pointer-events: none;
        transition: var(--transition);
    }
    
    .input-icon-wrapper input {
        width: 100%;
        padding: 0.9rem 1rem 0.9rem 2.8rem;
        font-size: 1rem;
        font-family: inherit;
        border: 2px solid var(--border-color);
        border-radius: var(--radius);
        background: var(--cream);
        color: var(--text-primary);
        transition: var(--transition);
    }
    
    .input-icon-wrapper input:focus {
        outline: none;
        border-color: var(--terracotta);
        background: white;
        box-shadow: 0 0 0 4px rgba(198, 123, 92, 0.12);
    }
    
    .input-icon-wrapper input:focus ~ .input-icon,
    .input-icon-wrapper input:focus + .input-icon {
        color: var(--terracotta);
    }
    
    .input-icon-wrapper:focus-within .input-icon {
        color: var(--terracotta);
    }
    
    .input-icon-wrapper input::placeholder {
        color: var(--text-muted);
        opacity: 0.7;
    }
    
    .auth-submit {
        width: 100%;
        padding: 1rem 1.5rem;
        font-size: 1.05rem;
        justify-content: center;
        background: linear-gradient(135deg, var(--terracotta) 0%, var(--terracotta-dark) 100%);
        border: none;
        border-radius: var(--radius);
        margin-top: 0.5rem;
    }
    
    .auth-submit:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(198, 123, 92, 0.35);
    }
    
    .auth-footer {
        text-align: center;
        margin-top: 2rem;
        padding-top: 1.5rem;
        border-top: 2px solid var(--border-light);
    }
    
    .auth-footer p {
        color: var(--text-muted);
        font-size: 0.95rem;
    }
    
    .auth-footer a {
        font-weight: 700;
        color: var(--terracotta);
        transition: var(--transition);
    }
    
    .auth-footer a:hover {
        color: var(--terracotta-dark);
    }
    
    /* Decorative element */
    .auth-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 60px;
        height: 4px;
        background: linear-gradient(90deg, var(--terracotta), var(--muted-orange), var(--sage));
        border-radius: 0 0 var(--radius) var(--radius);
        opacity: 0;
    }
    
    @media (max-width: 480px) {
        .auth-card {
            padding: 2rem 1.5rem;
        }
        .auth-header h1 {
            font-size: 1.65rem;
        }
    }
</style>
{% endblock %}
