name: Keep Aiven Database Alive

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  ping-database:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pymysql cryptography

      - name: Test DNS resolution
        run: |
          echo "Testing DNS resolution..."
          nslookup mysql-gymgraph-andresrubio581-f3b7.i.aivencloud.com || true
          echo "Testing connectivity..."
          timeout 5 bash -c "echo > /dev/tcp/mysql-gymgraph-andresrubio581-f3b7.i.aivencloud.com/17736" 2>/dev/null && echo "Port 17736 is reachable" || echo "Port 17736 might be blocked"

      - name: Ping Aiven MySQL Database
        env:
          DATABASE_URL: ${{ secrets.AIVEN_DATABASE_URL }}
        run: |
          python -c "
          import pymysql
          import os
          import sys
          from urllib.parse import urlparse, parse_qs, unquote
          from datetime import datetime
          
          try:
              # Obtener y limpiar la URL
              raw_url = os.environ['DATABASE_URL']
              print(f'Raw URL format: mysql+pymysql://user:password@host:port/database?ssl_ca=ca.pem')
              print(f'URL length: {len(raw_url)} characters')
              
              # Parsear la URL
              url = urlparse(raw_url)
              
              # Extraer componentes con limpieza
              host = url.hostname
              port = url.port or 3306
              user = url.username
              password = unquote(url.password) if url.password else ''
              database = url.path.lstrip('/')
              
              print(f'Parsed connection details:')
              print(f'  Host: {host}')
              print(f'  Port: {port}')
              print(f'  User: {user}')
              print(f'  Database: {database}')
              print(f'  Password length: {len(password)}')
              
              # Intentar resolver DNS desde Python
              import socket
              try:
                  ip = socket.gethostbyname(host)
                  print(f'  DNS resolved: {host} -> {ip}')
              except Exception as dns_error:
                  print(f'  DNS resolution failed: {dns_error}')
              
              # Configurar SSL
              ssl_config = {
                  'ssl': {
                      'ca': 'ca.pem',
                      'check_hostname': True
                  }
              }
              
              print('Attempting connection...')
              
              # Intentar conectar con timeout extendido
              conn = pymysql.connect(
                  host=host,
                  port=port,
                  user=user,
                  password=password,
                  database=database,
                  ssl=ssl_config,
                  connect_timeout=30,  # Aumentado a 30 segundos
                  read_timeout=30,
                  write_timeout=30
              )
              
              cur = conn.cursor()
              cur.execute('SELECT 1 AS keep_alive_check, NOW() AS current_time;')
              result = cur.fetchone()
              
              print(f'✅ Database ping successful at {result[1]}')
              print(f'   Connection established to {host}')
              
              cur.close()
              conn.close()
              
          except pymysql.OperationalError as e:
              print(f'❌ Connection error: {e}')
              print(f'   Error code: {e.args[0] if e.args else \"unknown\"}')
              sys.exit(1)
          except Exception as e:
              print(f'❌ Unexpected error: {e}')
              print(f'   Error type: {type(e).__name__}')
              sys.exit(1)
          "
